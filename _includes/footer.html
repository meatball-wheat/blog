<style>
  .site-footer {
    background-color: #DCCCAC !important;
    border-top: 2px dashed #99AD7A !important;
    padding: 20px 0 !important;
    font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
  }

  .footer-content {
    text-align: center;
    color: #546B41;
  }

  .footer-info {
    font-size: 0.85rem;
    color: #546B41;
    margin-bottom: 10px;
  }

  .footer-info .tagline {
    opacity: 0.85;
  }

  .footer-social {
    display: flex;
    justify-content: center;
    gap: 18px;
  }

  .footer-social a {
    color: #546B41;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.85rem;
  }

  .footer-social a:hover {
    color: #99AD7A;
  }

  .footer-social a svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    vertical-align: middle;
  }


</style>

<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <div class="footer-content">
      <p class="footer-info">&copy; {{ site.time | date: '%Y' }} {{ site.title }} · <span class="tagline">{{ site.description | escape }}</span></p>
      <div class="footer-social">
        {%- if site.github_username -%}
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
        {%- endif -%}
        {%- if site.email -%}
        <a href="mailto:{{ site.email }}">
          <svg viewBox="0 0 16 16"><path d="M2 3h12a1 1 0 011 1v8a1 1 0 01-1 1H2a1 1 0 01-1-1V4a1 1 0 011-1zm0 1v.217l6 3.6 6-3.6V4H2zm0 1.383V12h12V5.383l-6 3.6-6-3.6z"/></svg>
          Email
        </a>
        {%- endif -%}
      </div>
    </div>
  </div>
</footer>
