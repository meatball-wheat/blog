---
layout: default
---
<style>
    /* 页面整体背景 - 奶油白 */
    body {
        background-color: #FFF8EC !important;
    }

    /* ===== 全局元素配色统一为橄榄绿 ===== */
    .site-header {
        border-top-color: #99AD7A;
        border-bottom-color: #99AD7A;
    }

    .site-title,
    .site-title:visited {
        color: #546B41 !important;
    }

    .site-nav .page-link,
    .site-nav .page-link:visited {
        color: #546B41;
    }

    .site-nav .page-link:hover {
        color: #99AD7A;
    }

    a {
        color: #546B41;
    }

    a:hover {
        color: #99AD7A;
    }

    /* 页面容器 */
    .post {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        padding: 10px 0;
    }

    /* 页面标题区域 */
    .post-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 3px solid #99AD7A;
    }

    .post-title {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        color: #546B41;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        line-height: 1.3;
    }

    /* 内容区域 */
    .post-content {
        color: #333;
        line-height: 1.8;
        font-size: 1.05rem;
    }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        color: #546B41;
        margin-top: 2rem;
        margin-bottom: 1rem;
        line-height: 1.3;
    }

    .post-content h1 {
        font-size: 1.8rem;
        border-bottom: 2px dashed #DCCCAC;
        padding-bottom: 0.5rem;
    }

    .post-content h2 {
        font-size: 1.5rem;
    }

    .post-content h3 {
        font-size: 1.3rem;
    }

    .post-content p {
        margin-bottom: 1.2rem;
    }

    .post-content a {
        color: #546B41;
        text-decoration: underline;
        text-decoration-color: #99AD7A;
        transition: color 0.2s ease;
    }

    .post-content a:hover {
        color: #99AD7A;
    }

    /* 代码块 */
    .post-content pre,
    .post-content code {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace !important;
        background-color: #DCCCAC;
        border-radius: 4px;
    }

    .post-content code {
        padding: 2px 6px;
        font-size: 0.9em;
    }

    .post-content pre {
        padding: 16px;
        overflow-x: auto;
        margin-bottom: 1.5rem;
    }

    .post-content pre code {
        background-color: transparent;
        padding: 0;
    }

    /* 引用块 */
    .post-content blockquote {
        border-left: 4px solid #99AD7A;
        padding-left: 1rem;
        margin-left: 0;
        margin-bottom: 1.5rem;
        color: #546B41;
        font-style: italic;
    }

    /* 列表 */
    .post-content ul,
    .post-content ol {
        margin-bottom: 1.5rem;
        padding-left: 2rem;
    }

    .post-content li {
        margin-bottom: 0.5rem;
    }

    /* 图片 */
    .post-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1.5rem 0;
    }

    /* 水平分割线 */
    .post-content hr {
        border: none;
        border-top: 2px dashed #DCCCAC;
        margin: 2rem 0;
    }

    /* 表格 */
    .post-content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
    }

    .post-content th,
    .post-content td {
        padding: 10px;
        border: 1px solid #DCCCAC;
        text-align: left;
    }

    .post-content th {
        background-color: #DCCCAC;
        color: #546B41;
        font-weight: bold;
    }

    .post-content tr:nth-child(even) {
        background-color: rgba(220, 204, 172, 0.3);
    }
</style>

<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
</article>
