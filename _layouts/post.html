---
layout: default
---
<style>
    /* 页面整体背景 - 奶油白 */
    body {
        background-color: #FFF8EC !important;
    }

    /* 文章页面容器 */
    .post-page {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        padding: 10px 0;
    }

    /* 文章标题区域 */
    .post-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 3px solid #99AD7A;
    }

    .post-title {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        color: #546B41;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        line-height: 1.3;
    }

    /* 文章元信息 */
    .post-meta {
        color: #546B41;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .post-meta time {
        color: #546B41;
    }

    .post-meta-separator {
        color: #99AD7A;
    }

    /* 文章标签 */
    .post-tag {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        font-size: 0.85rem;
        background-color: #99AD7A;
        color: #FFF8EC;
        padding: 3px 10px;
        border-radius: 12px;
        text-decoration: none;
        transition: background-color 0.2s ease;
    }

    .post-tag:hover {
        background-color: #546B41;
    }

    /* 文章内容区域 */
    .post-content {
        color: #333;
        line-height: 1.8;
        font-size: 1.05rem;
    }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif !important;
        color: #546B41;
        margin-top: 2rem;
        margin-bottom: 1rem;
        line-height: 1.3;
    }

    .post-content h1 {
        font-size: 1.8rem;
        border-bottom: 2px dashed #DCCCAC;
        padding-bottom: 0.5rem;
    }

    .post-content h2 {
        font-size: 1.5rem;
    }

    .post-content h3 {
        font-size: 1.3rem;
    }

    .post-content p {
        margin-bottom: 1.2rem;
    }

    .post-content a {
        color: #546B41;
        text-decoration: underline;
        text-decoration-color: #99AD7A;
        transition: color 0.2s ease;
    }

    .post-content a:hover {
        color: #99AD7A;
    }

    /* 代码块 */
    .post-content pre,
    .post-content code {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace !important;
        background-color: #DCCCAC;
        border-radius: 4px;
    }

    .post-content code {
        padding: 2px 6px;
        font-size: 0.9em;
    }

    .post-content pre {
        padding: 16px;
        overflow-x: auto;
        margin-bottom: 1.5rem;
    }

    .post-content pre code {
        background-color: transparent;
        padding: 0;
    }

    /* 引用块 */
    .post-content blockquote {
        border-left: 4px solid #99AD7A;
        padding-left: 1rem;
        margin-left: 0;
        margin-bottom: 1.5rem;
        color: #546B41;
        font-style: italic;
    }

    /* 列表 */
    .post-content ul,
    .post-content ol {
        margin-bottom: 1.5rem;
        padding-left: 2rem;
    }

    .post-content li {
        margin-bottom: 0.5rem;
    }

    /* 图片 */
    .post-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1.5rem 0;
    }

    /* 水平分割线 */
    .post-content hr {
        border: none;
        border-top: 2px dashed #DCCCAC;
        margin: 2rem 0;
    }

    /* 表格 */
    .post-content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
    }

    .post-content th,
    .post-content td {
        padding: 10px;
        border: 1px solid #DCCCAC;
        text-align: left;
    }

    .post-content th {
        background-color: #DCCCAC;
        color: #546B41;
        font-weight: bold;
    }

    .post-content tr:nth-child(even) {
        background-color: rgba(220, 204, 172, 0.3);
    }

    /* ===== TOC Sidebar ===== */
    .post-body-wrapper {
        display: block;
    }

    .post-body-wrapper .post-content {
        max-width: 100%;
    }

    .toc-sidebar {
        position: fixed;
        top: 2rem;
        width: 240px;
        max-height: calc(100vh - 4rem);
        overflow-y: auto;
        padding: 1rem 0;
        font-family: 'Comic Sans MS', 'Comic Sans', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
    }

    .toc-sidebar-title {
        font-size: 0.95rem;
        font-weight: bold;
        color: #546B41;
        margin-bottom: 0.8rem;
        padding-left: 12px;
        border-left: 3px solid #99AD7A;
    }

    .toc-sidebar ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .toc-sidebar li {
        margin: 0;
    }

    .toc-sidebar li a {
        display: block;
        padding: 5px 12px;
        font-size: 0.85rem;
        color: #546B41;
        text-decoration: none;
        line-height: 1.5;
        border-radius: 6px;
        margin: 1px 8px;
        transition: all 0.2s ease;
        word-break: break-word;
    }

    .toc-sidebar li a:hover {
        color: #99AD7A;
    }

    .toc-sidebar li.toc-h1 a {
        padding-left: 12px;
        font-size: 0.9rem;
        font-weight: bold;
    }

    .toc-sidebar li.toc-h2 a {
        padding-left: 24px;
        font-size: 0.85rem;
    }

    .toc-sidebar li.toc-h3 a {
        padding-left: 36px;
        font-size: 0.82rem;
    }

    .toc-sidebar li a.active {
        background-color: #99AD7A;
        color: #FFF8EC;
        font-weight: bold;
    }

    /* 响应式：小屏隐藏TOC */
    @media (max-width: 1024px) {
        .toc-sidebar {
            display: none;
        }
    }

    /* TOC scrollbar */
    .toc-sidebar::-webkit-scrollbar {
        width: 4px;
    }
    .toc-sidebar::-webkit-scrollbar-track {
        background: transparent;
    }
    .toc-sidebar::-webkit-scrollbar-thumb {
        background-color: #DCCCAC;
        border-radius: 4px;
    }
</style>

<article class="post-page h-entry" itemscope itemtype="http://schema.org/BlogPosting">

    <header class="post-header">
        <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
        <p class="post-meta">
            <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
                {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
                {{ page.date | date: date_format }}
            </time>
            {%- if page.tags.size > 0 -%}
            <span class="post-meta-separator">|</span>
            {%- for tag in page.tags -%}
            <a href="{{ site.baseurl }}/tags/#{{ tag | slugify }}" class="post-tag">{{ tag }}</a>
            {%- endfor -%}
            {%- endif -%}
        </p>
    </header>

    <div class="post-body-wrapper">
        <div class="post-content e-content" itemprop="articleBody">
            {{ content }}
        </div>
        <nav class="toc-sidebar" id="toc-sidebar"></nav>
    </div>

    <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var content = document.querySelector('.post-content');
    var sidebar = document.getElementById('toc-sidebar');
    if (!content || !sidebar) return;

    var headings = content.querySelectorAll('h1, h2, h3');
    if (headings.length === 0) {
        sidebar.style.display = 'none';
        return;
    }

    // Build TOC
    var title = document.createElement('div');
    title.className = 'toc-sidebar-title';
    title.textContent = '目录';
    sidebar.appendChild(title);

    var ul = document.createElement('ul');
    sidebar.appendChild(ul);

    var idCounters = {};
    headings.forEach(function(heading) {
        // Ensure unique id
        if (!heading.id) {
            heading.id = heading.textContent.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');
        }
        var baseId = heading.id;
        if (idCounters[baseId] !== undefined) {
            idCounters[baseId]++;
            heading.id = baseId + '-' + idCounters[baseId];
        } else {
            idCounters[baseId] = 0;
        }

        var li = document.createElement('li');
        var tag = heading.tagName.toLowerCase();
        li.className = tag === 'h3' ? 'toc-h3' : tag === 'h2' ? 'toc-h2' : 'toc-h1';
        var a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent;
        a.setAttribute('data-target', heading.id);
        li.appendChild(a);
        ul.appendChild(li);
    });

    // Smooth scroll on click
    sidebar.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (!a) return;
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('data-target'));
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });

    // IntersectionObserver for scroll highlighting
    var tocLinks = sidebar.querySelectorAll('a');
    var observerOptions = {
        rootMargin: '-20px 0px -70% 0px',
        threshold: 0
    };

    var currentActive = null;

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                var id = entry.target.id;
                tocLinks.forEach(function(link) {
                    if (link.getAttribute('data-target') === id) {
                        link.classList.add('active');
                        currentActive = link;
                    } else {
                        link.classList.remove('active');
                    }
                });
            }
        });
    }, observerOptions);

    // Calculate TOC position based on wrapper right edge
    function positionToc() {
        var wrapper = document.querySelector('.page-content .wrapper') || document.querySelector('.page-content');
        if (!wrapper) return;
        var rect = wrapper.getBoundingClientRect();
        var rightOffset = window.innerWidth - rect.right - 240 - 32;
        sidebar.style.right = Math.max(16, rightOffset) + 'px';
    }
    positionToc();
    window.addEventListener('resize', positionToc);

    headings.forEach(function(heading) {
        observer.observe(heading);
    });
});
</script>
